<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting Scrutinizer...</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-app-region: drag;
        }

        .container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        img.logo {
            width: 128px;
            height: 128px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.2));
        }

        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0 0 16px 0;
            opacity: 0.9;
        }

        .loader {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
        }

        .loader-bar {
            width: 100%;
            height: 100%;
            background: #00ffff;
            transform: translateX(-100%);
            animation: loading 1.5s infinite ease-in-out;
            box-shadow: 0 0 10px #00ffff;
        }

        .status {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-family: monospace;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="assets/scrutinizer_512x512_icon.png" class="logo" alt="Scrutinizer Logo">
        <h1>SCRUTINIZER</h1>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        <div class="status">INITIALIZING VISION CORE...</div>
        <div id="version"
            style="position: absolute; bottom: 10px; right: 10px; font-size: 10px; opacity: 0.3; font-family: monospace;">
            v...</div>
    </div>
</body>

</html>
