<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reference: Color Spectrum (Desaturation Diagnostic)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .spectrum-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Full-width hue gradient strip --- */
        .hue-strip {
            flex: 1;
            position: relative;
        }

        /* Continuous HSL hue gradient at full saturation */
        .hue-gradient {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right,
                hsl(0, 100%, 50%),      /* Red */
                hsl(30, 100%, 50%),     /* Orange */
                hsl(60, 100%, 50%),     /* Yellow */
                hsl(90, 100%, 50%),     /* Yellow-green */
                hsl(120, 100%, 50%),    /* Green */
                hsl(150, 100%, 50%),    /* Cyan-green */
                hsl(180, 100%, 50%),    /* Cyan (rod peak ~505nm) */
                hsl(210, 100%, 50%),    /* Blue-cyan */
                hsl(240, 100%, 50%),    /* Blue */
                hsl(270, 100%, 50%),    /* Violet */
                hsl(300, 100%, 50%),    /* Magenta */
                hsl(330, 100%, 50%),    /* Pink */
                hsl(360, 100%, 50%)     /* Red (wrap) */
            );
        }

        /* --- Labeled color patches row --- */
        .patches-row {
            height: 80px;
            display: flex;
            width: 100%;
        }

        .patch {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: rgba(0,0,0,0.7);
            text-shadow: 0 0 4px rgba(255,255,255,0.5);
            border-right: 1px solid rgba(0,0,0,0.15);
        }
        .patch:last-child { border-right: none; }

        /* Dark text on bright patches, light text on dark patches */
        .patch.dark-text { color: rgba(0,0,0,0.8); }
        .patch.light-text { color: rgba(255,255,255,0.9); text-shadow: 0 0 4px rgba(0,0,0,0.5); }

        /* --- Brightness reference rows (same hues at different L*) --- */
        .brightness-row {
            height: 60px;
            display: flex;
            width: 100%;
        }
        .brightness-row .patch {
            font-size: 10px;
        }

        /* --- Gray ramp for achromatic reference --- */
        .gray-ramp {
            height: 40px;
            background: linear-gradient(to right, #000, #fff);
        }

        /* --- Size-graded patches: same hue at decreasing widths --- */
        .size-row {
            height: 70px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: #222;
            flex-wrap: wrap;
        }
        .size-row .label {
            font-size: 10px;
            color: #888;
            width: 60px;
            text-align: right;
            flex-shrink: 0;
        }
        .size-swatch {
            height: 100%;
            flex-shrink: 0;
            border-radius: 2px;
        }

        /* --- Rod sensitivity curve overlay --- */
        .rod-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Fixation cross */
        .fixation {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 24px;
            background: white;
            transform: translate(-50%, -50%);
            z-index: 100;
            mix-blend-mode: difference;
        }
        .fixation::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 2px;
            background: white;
            transform: translate(-50%, -50%);
        }

        /* Wavelength labels */
        .wavelength-labels {
            height: 24px;
            display: flex;
            width: 100%;
            background: #111;
        }
        .wavelength-labels span {
            flex: 1;
            text-align: center;
            font-size: 10px;
            color: #666;
            line-height: 24px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="fixation"></div>
    <div class="spectrum-container">
        <!-- Approximate wavelength labels -->
        <div class="wavelength-labels">
            <span>700nm</span><span>620</span><span>590</span><span>570</span>
            <span>530</span><span>510</span><span>505nm ★</span><span>480</span>
            <span>450</span><span>420</span><span>380nm</span>
        </div>

        <!-- Full-saturation hue gradient (main diagnostic strip) -->
        <div class="hue-strip">
            <div class="hue-gradient"></div>
            <!-- Rod sensitivity curve: peaks at ~505nm (cyan), drawn as SVG -->
            <svg class="rod-curve" viewBox="0 0 1000 200" preserveAspectRatio="none">
                <!-- Approximate scotopic luminosity (rod) curve mapped to hue position -->
                <!-- Peak at ~505nm ≈ 54% across from red end (hue ~180°) -->
                <polyline fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"
                    points="0,195 77,190 154,175 231,155 308,130 385,100 462,60 500,45 538,50 577,65 615,90 692,140 769,170 846,190 923,195 1000,198" />
                <text x="500" y="35" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14" font-family="system-ui">
                    rod sensitivity (V')
                </text>
            </svg>
        </div>

        <!-- Named color patches at full saturation -->
        <div class="patches-row">
            <div class="patch dark-text" style="background: hsl(0, 100%, 50%)">Red<br>0°</div>
            <div class="patch dark-text" style="background: hsl(30, 100%, 50%)">Orange<br>30°</div>
            <div class="patch dark-text" style="background: hsl(60, 100%, 50%)">Yellow<br>60°</div>
            <div class="patch dark-text" style="background: hsl(120, 100%, 50%)">Green<br>120°</div>
            <div class="patch dark-text" style="background: hsl(180, 100%, 50%)">Cyan<br>180°</div>
            <div class="patch light-text" style="background: hsl(210, 100%, 40%)">Blue-Cyan<br>210°</div>
            <div class="patch light-text" style="background: hsl(240, 100%, 35%)">Blue<br>240°</div>
            <div class="patch light-text" style="background: hsl(270, 100%, 35%)">Violet<br>270°</div>
            <div class="patch dark-text" style="background: hsl(300, 100%, 50%)">Magenta<br>300°</div>
        </div>

        <!-- Same hues at 75% lightness (tint) — tests desaturation on lighter colors -->
        <div class="brightness-row">
            <div class="patch dark-text" style="background: hsl(0, 100%, 75%)">Tint</div>
            <div class="patch dark-text" style="background: hsl(30, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(60, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(120, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(180, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(210, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(240, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(270, 100%, 75%)"></div>
            <div class="patch dark-text" style="background: hsl(300, 100%, 75%)"></div>
        </div>

        <!-- Same hues at 25% lightness (shade) — tests desaturation on darker colors -->
        <div class="brightness-row">
            <div class="patch light-text" style="background: hsl(0, 100%, 25%)">Shade</div>
            <div class="patch light-text" style="background: hsl(30, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(60, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(120, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(180, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(210, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(240, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(270, 100%, 25%)"></div>
            <div class="patch light-text" style="background: hsl(300, 100%, 25%)"></div>
        </div>

        <!-- Size-graded patches: same hue at decreasing widths.
             Larger patches survive peripheral pooling; smaller ones lose chromatic identity.
             Tests the spatial frequency dependence in u_rg_freq_decay / u_yv_freq_decay.
             RG (red/green) should lose identity at larger sizes than BY (blue/yellow). -->
        <div class="size-row">
            <span class="label">Red (RG)</span>
            <div class="size-swatch" style="width:120px; background:hsl(0,100%,50%)"></div>
            <div class="size-swatch" style="width:80px; background:hsl(0,100%,50%)"></div>
            <div class="size-swatch" style="width:48px; background:hsl(0,100%,50%)"></div>
            <div class="size-swatch" style="width:28px; background:hsl(0,100%,50%)"></div>
            <div class="size-swatch" style="width:16px; background:hsl(0,100%,50%)"></div>
            <div class="size-swatch" style="width:8px; background:hsl(0,100%,50%)"></div>
            <div class="size-swatch" style="width:4px; background:hsl(0,100%,50%)"></div>
            <span class="label">Green (RG)</span>
            <div class="size-swatch" style="width:120px; background:hsl(120,100%,45%)"></div>
            <div class="size-swatch" style="width:80px; background:hsl(120,100%,45%)"></div>
            <div class="size-swatch" style="width:48px; background:hsl(120,100%,45%)"></div>
            <div class="size-swatch" style="width:28px; background:hsl(120,100%,45%)"></div>
            <div class="size-swatch" style="width:16px; background:hsl(120,100%,45%)"></div>
            <div class="size-swatch" style="width:8px; background:hsl(120,100%,45%)"></div>
            <div class="size-swatch" style="width:4px; background:hsl(120,100%,45%)"></div>
        </div>
        <div class="size-row">
            <span class="label">Blue (BY)</span>
            <div class="size-swatch" style="width:120px; background:hsl(240,100%,50%)"></div>
            <div class="size-swatch" style="width:80px; background:hsl(240,100%,50%)"></div>
            <div class="size-swatch" style="width:48px; background:hsl(240,100%,50%)"></div>
            <div class="size-swatch" style="width:28px; background:hsl(240,100%,50%)"></div>
            <div class="size-swatch" style="width:16px; background:hsl(240,100%,50%)"></div>
            <div class="size-swatch" style="width:8px; background:hsl(240,100%,50%)"></div>
            <div class="size-swatch" style="width:4px; background:hsl(240,100%,50%)"></div>
            <span class="label">Yellow (BY)</span>
            <div class="size-swatch" style="width:120px; background:hsl(60,100%,50%)"></div>
            <div class="size-swatch" style="width:80px; background:hsl(60,100%,50%)"></div>
            <div class="size-swatch" style="width:48px; background:hsl(60,100%,50%)"></div>
            <div class="size-swatch" style="width:28px; background:hsl(60,100%,50%)"></div>
            <div class="size-swatch" style="width:16px; background:hsl(60,100%,50%)"></div>
            <div class="size-swatch" style="width:8px; background:hsl(60,100%,50%)"></div>
            <div class="size-swatch" style="width:4px; background:hsl(60,100%,50%)"></div>
        </div>
        <div class="size-row">
            <span class="label">Cyan ★</span>
            <div class="size-swatch" style="width:120px; background:hsl(180,100%,50%)"></div>
            <div class="size-swatch" style="width:80px; background:hsl(180,100%,50%)"></div>
            <div class="size-swatch" style="width:48px; background:hsl(180,100%,50%)"></div>
            <div class="size-swatch" style="width:28px; background:hsl(180,100%,50%)"></div>
            <div class="size-swatch" style="width:16px; background:hsl(180,100%,50%)"></div>
            <div class="size-swatch" style="width:8px; background:hsl(180,100%,50%)"></div>
            <div class="size-swatch" style="width:4px; background:hsl(180,100%,50%)"></div>
            <span class="label">Magenta</span>
            <div class="size-swatch" style="width:120px; background:hsl(300,100%,50%)"></div>
            <div class="size-swatch" style="width:80px; background:hsl(300,100%,50%)"></div>
            <div class="size-swatch" style="width:48px; background:hsl(300,100%,50%)"></div>
            <div class="size-swatch" style="width:28px; background:hsl(300,100%,50%)"></div>
            <div class="size-swatch" style="width:16px; background:hsl(300,100%,50%)"></div>
            <div class="size-swatch" style="width:8px; background:hsl(300,100%,50%)"></div>
            <div class="size-swatch" style="width:4px; background:hsl(300,100%,50%)"></div>
        </div>

        <!-- Achromatic gray ramp — reference for pure luminance (no hue to lose) -->
        <div class="gray-ramp"></div>

        <!-- Opponent channel diagnostic: isolated R-G and B-Y pairs -->
        <div class="patches-row" style="height: 60px;">
            <div class="patch dark-text" style="background: #ff0000">R</div>
            <div class="patch dark-text" style="background: #00ff00">G</div>
            <div class="patch dark-text" style="background: #ff0000; opacity: 0.5; background: linear-gradient(to right, #ff0000, #00ff00)">R→G</div>
            <div class="patch" style="background: #888"></div>
            <div class="patch light-text" style="background: #0000ff">B</div>
            <div class="patch dark-text" style="background: #ffff00">Y</div>
            <div class="patch dark-text" style="background: linear-gradient(to right, #0000ff, #ffff00)">B→Y</div>
            <div class="patch" style="background: #888"></div>
            <div class="patch dark-text" style="background: #00ffff">Cyan<br>★ 505nm</div>
        </div>
    </div>
</body>

</html>
