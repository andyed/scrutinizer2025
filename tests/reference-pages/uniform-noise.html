<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference: Spatially Uniform Noise Field</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: #808080; }
    canvas { position: fixed; top: 0; left: 0; }
    .fixation {
        position: fixed; top: 50%; left: 50%;
        width: 2px; height: 24px; background: #fff;
        transform: translate(-50%, -50%); z-index: 100;
        mix-blend-mode: difference;
    }
    .fixation::after {
        content: ''; position: absolute; top: 50%; left: 50%;
        width: 24px; height: 2px; background: #fff;
        transform: translate(-50%, -50%);
    }
    .label {
        position: fixed; bottom: 8px; right: 12px;
        font: 10px/1 monospace; color: #fff;
        mix-blend-mode: difference; z-index: 100; opacity: 0.5;
    }
</style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="fixation"></div>
    <div class="label" id="label"></div>
    <script>
    // Full-field noise with UNIFORM spatial statistics: every region of the
    // viewport has the same expected local contrast, by construction. This is
    // the controlled substrate for the radial-profile monotonicity test — a
    // correct foveation should yield local-contrast (Oklab L stdDev) that
    // DECLINES monotonically with eccentricity. Any peripheral rise is a
    // render defect, not content, because the content has no radial structure.
    //
    // ?cell=<px>  block size of a noise element (default 3). Larger cells put
    //             energy at lower spatial frequency (more robust to downsampling).
    // ?amp=<0-1>  contrast amplitude around mid-gray (default 0.5 -> full range).
    // ?seed=<int> deterministic seed so captures are reproducible.
    const params = new URLSearchParams(location.search);
    const cell = Math.max(1, parseInt(params.get('cell') || '3', 10));
    const amp  = Math.min(1, Math.max(0, parseFloat(params.get('amp') || '0.5')));
    let seed   = (parseInt(params.get('seed') || '12345', 10) >>> 0) || 1;

    // Deterministic PRNG (mulberry32) — no Date/Math.random, reproducible.
    function rng() {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    const canvas = document.getElementById('c');
    function draw() {
        const w = canvas.width = window.innerWidth;
        const h = canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(w, h);
        const d = img.data;
        // Precompute one random value per block, then fill the block. Uniform
        // over the whole field: block values are i.i.d. everywhere.
        const cols = Math.ceil(w / cell), rows = Math.ceil(h / cell);
        const blocks = new Uint8Array(cols * rows);
        for (let i = 0; i < blocks.length; i++) {
            // symmetric around 128 with amplitude `amp`
            const v = 128 + (rng() - 0.5) * 2 * amp * 127;
            blocks[i] = v < 0 ? 0 : v > 255 ? 255 : v;
        }
        for (let y = 0; y < h; y++) {
            const by = (y / cell) | 0;
            for (let x = 0; x < w; x++) {
                const bx = (x / cell) | 0;
                const g = blocks[by * cols + bx];
                const o = (y * w + x) * 4;
                d[o] = d[o + 1] = d[o + 2] = g;  // achromatic: isolate luminance
                d[o + 3] = 255;
            }
        }
        ctx.putImageData(img, 0, 0);
    }
    draw();
    document.getElementById('label').textContent = `noise cell=${cell} amp=${amp}`;
    </script>
</body>
</html>
