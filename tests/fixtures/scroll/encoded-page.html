<!doctype html>
<html><head><meta charset="utf-8"><title>scroll-encoded probe page</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #111; font: 16px/1.5 Georgia, serif; }
  /* Left gutter encodes absolute page y (CSS px) as four base-16 gray digits,
     one 6px column per digit, so a captured bitmap names its own scroll. */
  #code { position: absolute; left: 0; top: 0; width: 24px; image-rendering: pixelated; }
  main { margin-left: 48px; max-width: 760px; padding: 8px 0; }
  p { margin: 0 0 1em; }
  h2 { margin: 1.2em 0 .4em; font-size: 22px; }
</style></head>
<body>
<canvas id="code"></canvas>
<main id="main"></main>
<script>
  const H = 16000;
  const c = document.getElementById('code');
  c.width = 4; c.height = H; c.style.height = H + 'px';
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(4, H);
  for (let y = 0; y < H; y++) {
    for (let d = 0; d < 4; d++) {
      const digit = (y >> (4 * (3 - d))) & 15;
      const v = digit * 17;
      const i = (y * 4 + d) * 4;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const words = 'foveal cortical magnification crowding periphery saccade fixation reading span acuity pooling eccentricity contrast texture summary statistics scene gist attention'.split(' ');
  const main = document.getElementById('main');
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let html = '';
  for (let s = 0; s < 120; s++) {
    html += '<h2>Section ' + (s + 1) + '</h2>';
    for (let p = 0; p < 3; p++) {
      let t = '';
      for (let w = 0; w < 60; w++) t += words[Math.floor(rnd() * words.length)] + ' ';
      html += '<p>' + t + '</p>';
    }
  }
  main.innerHTML = html;
  document.body.style.minHeight = H + 'px';
</script>
</body></html>
