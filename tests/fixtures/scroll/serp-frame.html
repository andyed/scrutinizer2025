<!doctype html>
<html><head><meta charset="utf-8"><title>serp preview frame</title>
<style>
  /* Video preview loaded into serp-page.html on hover. */
  html, body { margin: 0; height: 100%; background: #202124; color: #e8eaed; font: 12px/1.4 Arial, sans-serif; overflow: hidden; }
  p { margin: 0; padding: 6px 8px; }
  i { position: absolute; left: 0; bottom: 0; height: 4px; background: #ea4335; animation: play 2s linear infinite; }
  @keyframes play { from { width: 0; } to { width: 100%; } }
</style></head>
<body><p>preview: saccade fixation reading span acuity pooling eccentricity</p><i></i></body></html>
