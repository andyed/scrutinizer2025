<!DOCTYPE html>
<html>

<head>
    <title>Visual Memory Test</title>
</head>

<body>
    <canvas id="overlay-canvas" width="800" height="600"></canvas>
    <script>
        const { ipcRenderer } = require('electron');

        // Mock Logger
        const mockLogger = {
            log: (msg) => ipcRenderer.send('log', msg),
            error: (msg) => ipcRenderer.send('log', 'ERROR: ' + msg),
            warn: (msg) => ipcRenderer.send('log', 'WARN: ' + msg)
        };

        try {
            // Load Scrutinizer
            require('../renderer/scrutinizer.js');

            // Mock config
            const mockConfig = {
                fovealRadius: 100,
                intensity: 0.8,
                maskSmoothness: 1.0, // Instant movement for testing
                visualMemoryLimit: 5, // Enable memory
                debugBoundary: 0,
                mongrelMode: 0,
                aestheticMode: 0
            };

            const scrutinizer = new window.Scrutinizer(mockConfig);
            scrutinizer.setVisualMemoryLimit(5); // Ensure limit is set
            scrutinizer.enable();

            // Helper to simulate time and render
            const simulate = (durationMs, x, y) => {
                const step = 16; // ~60fps
                const steps = Math.floor(durationMs / step);

                // Set mouse position
                scrutinizer.mouseX = x;
                scrutinizer.mouseY = y;
                scrutinizer.targetMouseX = x;
                scrutinizer.targetMouseY = y;
                scrutinizer.lastMouseX = x;
                scrutinizer.lastMouseY = y;
                scrutinizer.currentVelocity = 0; // Force stationary

                for (let i = 0; i < steps; i++) {
                    scrutinizer.render();
                    // Manually advance time if needed, but render() uses performance.now()
                    // We can't easily mock performance.now() without more work, 
                    // but we can rely on the fact that we are calling render() in a loop.
                    // Actually, render() calculates dt based on performance.now().
                    // If we run this loop synchronously, dt will be ~0.
                    // We need to mock performance.now or sleep.
                    // Let's just mock the internal state for testing logic if possible,
                    // or use a sleep helper if we were async.
                    // Since this is a browser test, we can't easily sleep synchronously.

                    // BETTER APPROACH:
                    // We can manually tick the internal state if we expose it, 
                    // or just rely on the fact that we are testing the LOGIC, not the actual timing.
                    // But the logic DEPENDS on timing (2s dwell).

                    // Let's mock performance.now on the window?
                    // No, let's just manually set lastRenderTime and pass a fake time to render?
                    // render() calls performance.now() internally.
                }
            };

            // We need to verify the MASK content.
            // Scrutinizer draws to this.maskCanvas.
            const checkMaskAt = (x, y) => {
                const ctx = scrutinizer.maskCtx;
                // Mask is scaled by 0.25 usually
                const scaleX = scrutinizer.maskCanvas.width / scrutinizer.canvas.width;
                const scaleY = scrutinizer.maskCanvas.height / scrutinizer.canvas.height;

                const maskX = Math.floor(x * scaleX);
                const maskY = Math.floor(y * scaleY);

                const pixel = ctx.getImageData(maskX, maskY, 1, 1).data;
                // Alpha or White value should be high if remembered
                // We draw white with alpha.
                // If composite is screen, it adds up.
                // We check Red channel (should be > 0 if white is drawn)
                return pixel[0] > 50;
            };

            // --- TEST SEQUENCE ---

            // 1. Fixate at Point A (100, 100) for 1s (Should NOT remember)
            // We need to mock time. Let's override performance.now
            let virtualTime = 10000;
            const originalNow = performance.now;
            window.performance.now = () => virtualTime;

            scrutinizer.lastRenderTime = virtualTime;

            // Tick 1s
            scrutinizer.mouseX = 100; scrutinizer.mouseY = 100;
            scrutinizer.targetMouseX = 100; scrutinizer.targetMouseY = 100;

            // Frame 1: Start fixation
            scrutinizer.render();

            // Advance 1s
            virtualTime += 1000;
            scrutinizer.render(); // Should update logic

            // Check Buffer (should be empty)
            if (scrutinizer.visualMemoryBuffer.length > 0) {
                throw new Error('Test Failed: Added to buffer too early (1s)');
            }
            ipcRenderer.send('log', 'Pass: Buffer empty after 1s');

            // 2. Fixate at Point A for another 1.5s (Total 2.5s -> Should REMEMBER)
            virtualTime += 1500;
            scrutinizer.render();

            if (scrutinizer.visualMemoryBuffer.length === 0) {
                throw new Error('Test Failed: Did not add to buffer after 2.5s');
            }
            ipcRenderer.send('log', 'Pass: Added to buffer after 2.5s');

            // 3. Move to Point B (400, 400)
            // We need to simulate a move that breaks fixation.
            // Since our velocity smoothing is very aggressive (0.95), a single frame jump might not be enough
            // if we just rely on calculated velocity from 0.
            // Let's manually force a velocity spike to simulate the transit.
            scrutinizer.currentVelocity = 10.0;
            scrutinizer.render(); // This frame sees high velocity -> breaks fixation

            // Now arrive at B
            scrutinizer.mouseX = 400; scrutinizer.mouseY = 400;
            scrutinizer.targetMouseX = 400; scrutinizer.targetMouseY = 400;
            scrutinizer.lastMouseX = 400; scrutinizer.lastMouseY = 400;
            scrutinizer.currentVelocity = 0; // Stop

            virtualTime += 100;
            scrutinizer.render(); // This frame sees 0 velocity -> starts NEW fixation

            // Check A (should still be there in mask)
            if (!checkMaskAt(100, 100)) {
                throw new Error('Test Failed: Point A vanished from mask after moving to B');
            }
            ipcRenderer.send('log', 'Pass: Point A persisted in mask after move');

            // Check B (should be clear because it's current fovea)
            if (!checkMaskAt(400, 400)) {
                throw new Error('Test Failed: Point B (current fovea) is not clear');
            }
            ipcRenderer.send('log', 'Pass: Point B is clear');

            // Check Buffer (should still only have A)
            // B hasn't been fixated long enough (only 100ms since arrival)
            if (scrutinizer.visualMemoryBuffer.length > 1) {
                throw new Error('Test Failed: Point B added to buffer instantly');
            }

            // 4. Fixate B for 2.5s
            (async () => { // Wrap in async IIFE to allow await if needed, though we'll use virtualTime
                try {
                    // Load Scrutinizer
                    require('../renderer/scrutinizer.js');

                    // Mock config
                    const mockConfig = {
                        fovealRadius: 100,
                        intensity: 0.8,
                        maskSmoothness: 1.0, // Instant movement for testing
                        visualMemoryLimit: 2, // Set limit to 2 for FIFO test
                        debugBoundary: 0,
                        mongrelMode: 0,
                        aestheticMode: 0
                    };

                    const scrutinizer = new window.Scrutinizer(mockConfig);
                    scrutinizer.setVisualMemoryLimit(2); // Ensure limit is set to 2
                    scrutinizer.enable();

                    // Helper to simulate time and render
                    const simulate = (durationMs, x, y) => {
                        const step = 16; // ~60fps
                        const steps = Math.floor(durationMs / step);

                        // Set mouse position
                        scrutinizer.mouseX = x;
                        scrutinizer.mouseY = y;
                        scrutinizer.targetMouseX = x;
                        scrutinizer.targetMouseY = y;
                        scrutinizer.lastMouseX = x;
                        scrutinizer.lastMouseY = y;
                        scrutinizer.currentVelocity = 0; // Force stationary

                        for (let i = 0; i < steps; i++) {
                            scrutinizer.render();
                            // Manually advance time if needed, but render() uses performance.now()
                            // We can't easily mock performance.now() without more work, 
                            // but we can rely on the fact that we are calling render() in a loop.
                            // Actually, render() calculates dt based on performance.now().
                            // If we run this loop synchronously, dt will be ~0.
                            // We need to mock performance.now or sleep.
                            // Let's just mock the internal state for testing logic if possible,
                            // or use a sleep helper if we were async.
                            // Since this is a browser test, we can't easily sleep synchronously.

                            // BETTER APPROACH:
                            // We can manually tick the internal state if we expose it, 
                            // or just rely on the fact that we are testing the LOGIC, not the actual timing.
                            // But the logic DEPENDS on timing (2s dwell).

                            // Let's mock performance.now on the window?
                            // No, let's just manually set lastRenderTime and pass a fake time to render?
                            // render() calls performance.now() internally.
                        }
                    };

                    // We need to verify the MASK content.
                    // Scrutinizer draws to this.maskCanvas.
                    const checkMaskAt = (x, y, expected, pointName = `(${x}, ${y})`) => {
                        const ctx = scrutinizer.maskCtx;
                        // Mask is scaled by 0.25 usually
                        const scaleX = scrutinizer.maskCanvas.width / scrutinizer.canvas.width;
                        const scaleY = scrutinizer.maskCanvas.height / scrutinizer.canvas.height;

                        const maskX = Math.floor(x * scaleX);
                        const maskY = Math.floor(y * scaleY);

                        const pixel = ctx.getImageData(maskX, maskY, 1, 1).data;
                        // Alpha or White value should be high if remembered
                        // We draw white with alpha.
                        // If composite is screen, it adds up.
                        // We check Red channel (should be > 0 if white is drawn)
                        const isRemembered = pixel[0] > 50;
                        if (isRemembered !== expected) {
                            throw new Error(`Test Failed: Point ${pointName} mask check failed. Expected remembered: ${expected}, Actual: ${isRemembered}`);
                        }
                        return isRemembered;
                    };

                    // --- TEST SEQUENCE ---

                    // 1. Fixate at Point A (100, 100) for 1s (Should NOT remember)
                    // We need to mock time. Let's override performance.now
                    let virtualTime = 10000;
                    const originalNow = performance.now;
                    window.performance.now = () => virtualTime;

                    scrutinizer.lastRenderTime = virtualTime;

                    // Tick 1s
                    scrutinizer.mouseX = 100; scrutinizer.mouseY = 100;
                    scrutinizer.targetMouseX = 100; scrutinizer.targetMouseY = 100;

                    // Frame 1: Start fixation
                    scrutinizer.render();

                    // Advance 1s
                    virtualTime += 1000;
                    scrutinizer.render(); // Should update logic

                    // Check Buffer (should be empty)
                    if (scrutinizer.visualMemoryBuffer.length > 0) {
                        throw new Error('Test Failed: Added to buffer too early (1s)');
                    }
                    ipcRenderer.send('log', 'Pass: Buffer empty after 1s');

                    // 2. Fixate at Point A for another 1.5s (Total 2.5s -> Should REMEMBER)
                    virtualTime += 1500;
                    scrutinizer.render();

                    if (scrutinizer.visualMemoryBuffer.length === 0) {
                        throw new Error('Test Failed: Did not add to buffer after 2.5s');
                    }
                    ipcRenderer.send('log', 'Pass: Added to buffer after 2.5s');

                    // 3. Move to Point B (400, 400)
                    // We need to simulate a move that breaks fixation.
                    // Since our velocity smoothing is very aggressive (0.95), a single frame jump might not be enough
                    // if we just rely on calculated velocity from 0.
                    // Let's manually force a velocity spike to simulate the transit.
                    scrutinizer.currentVelocity = 10.0;
                    scrutinizer.render(); // This frame sees high velocity -> breaks fixation

                    // Now arrive at B
                    scrutinizer.mouseX = 400; scrutinizer.mouseY = 400;
                    scrutinizer.targetMouseX = 400; scrutinizer.targetMouseY = 400;
                    scrutinizer.lastMouseX = 400; scrutinizer.lastMouseY = 400;
                    scrutinizer.currentVelocity = 0; // Stop

                    virtualTime += 100;
                    scrutinizer.render(); // This frame sees 0 velocity -> starts NEW fixation

                    // Check A (should still be there in mask)
                    checkMaskAt(100, 100, true, 'A');
                    ipcRenderer.send('log', 'Pass: Point A persisted in mask after move');

                    // Check B (should be visible because it's current fovea)
                    checkMaskAt(400, 400, true, 'B (current fovea)');
                    ipcRenderer.send('log', 'Pass: Point B is visible (current fovea)');

                    // Check Buffer (should still only have A)
                    // B hasn't been fixated long enough (only 100ms since arrival)
                    if (scrutinizer.visualMemoryBuffer.length > 1) {
                        throw new Error('Test Failed: Point B added to buffer instantly');
                    }

                    // 4. Fixate B for 2.5s
                    virtualTime += 2500;
                    scrutinizer.render();

                    // Check A and B
                    checkMaskAt(100, 100, true, 'A');
                    checkMaskAt(400, 400, true, 'B');
                    ipcRenderer.send('log', 'Pass: Both A and B remembered');

                    // 5. Test FIFO Limit (The "Forget" Test)
                    // Current buffer: [A, B] (Limit is 2)
                    // Move to C and dwell. A should be evicted.
                    const targetXA = 100;
                    const targetYA = 100;
                    const targetXB = 400;
                    const targetYB = 400;
                    const targetXC = 500;
                    const targetYC = 500;

                    // Move to C
                    scrutinizer.mouseX = targetXC;
                    scrutinizer.mouseY = targetYC;
                    scrutinizer.targetMouseX = targetXC;
                    scrutinizer.targetMouseY = targetYC;
                    scrutinizer.lastMouseX = targetXC;
                    scrutinizer.lastMouseY = targetYC;
                    // Simulate velocity to break fixation
                    scrutinizer.currentVelocity = 10.0;
                    virtualTime += 100; // Simulate a frame with high velocity
                    scrutinizer.render();

                    scrutinizer.currentVelocity = 0; // Stop
                    virtualTime += 100; // Simulate arrival at C
                    scrutinizer.render();

                    // Dwell at C for 2.5s
                    virtualTime += 2500;
                    scrutinizer.render();

                    // Check Buffer: Should be [B, C]
                    if (scrutinizer.visualMemoryBuffer.length !== 2) {
                        throw new Error(`Buffer length wrong after C. Expected 2, got ${scrutinizer.visualMemoryBuffer.length}`);
                    }

                    // Check Mask:
                    // C (500,500) should be visible
                    checkMaskAt(targetXC, targetYC, true, 'C');
                    // B (400,400) should be visible
                    checkMaskAt(targetXB, targetYB, true, 'B');
                    // A (100,100) should be FORGOTTEN (Black/Blur)
                    checkMaskAt(targetXA, targetYA, false, 'A');

                    ipcRenderer.send('log', 'Pass: FIFO eviction worked (A forgotten, B & C remembered)');

                    // Restore
                    window.performance.now = originalNow;
                    ipcRenderer.send('test-result', { success: true, message: 'Visual Memory Logic Verified' });

                } catch (err) {
                    ipcRenderer.send('test-result', {
                        success: false,
                        message: err.message,
                        details: err.stack
                    });
                }
            })();
        } catch (err) {
            ipcRenderer.send('test-result', {
                success: false,
                message: err.message,
                details: err.stack
            });
        }
    </script>
</body>

</html>
