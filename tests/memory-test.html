<!DOCTYPE html>
<html>

<head>
    <title>Visual Memory Test</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: monospace;
        }

        #log {
            white-space: pre-wrap;
        }

        .pass {
            color: #4f4;
        }

        .fail {
            color: #f44;
        }
    </style>
</head>

<body>
    <h1>Visual Memory Logic Test</h1>
    <div id="log">Running tests...</div>
    <canvas id="overlay-canvas" width="800" height="600" style="display:none"></canvas>

    <script>
        const { ipcRenderer } = require('electron');

        // --- MOCKS ---

        // Mock Logger
        const mockLogger = {
            log: (msg) => console.log('[MockLog]', msg),
            error: (msg) => console.error('[MockError]', msg),
            warn: (msg) => console.warn('[MockWarn]', msg)
        };

        // Mock WebGLRenderer
        class MockWebGLRenderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.gl = {
                    createTexture: () => { },
                    bindTexture: () => { },
                    texParameteri: () => { },
                    texImage2D: () => { },
                    createBuffer: () => { },
                    bindBuffer: () => { },
                    bufferData: () => { },
                    enable: () => { },
                    blendFunc: () => { },
                    viewport: () => { },
                    useProgram: () => { },
                    enableVertexAttribArray: () => { },
                    vertexAttribPointer: () => { },
                    uniform1f: () => { },
                    uniform2f: () => { },
                    uniform1i: () => { },
                    activeTexture: () => { },
                    drawArrays: () => { },
                    clear: () => { },
                    clearColor: () => { },
                    getError: () => 0,
                    NO_ERROR: 0
                };
            }
            uploadTexture() { }
            uploadMask() { }
            uploadStructureMap() { }
            uploadSaliencyMap() { }
            render() { }
            clear() { }
        }

        // Mock Dependencies
        window.WebGLRenderer = MockWebGLRenderer;

        // Mock StructureMap/SaliencyMap if needed (they are required in scrutinizer.js)
        // We can just let them load if they don't depend on real WebGL context for instantiation
        // But scrutinizer.js requires them. Let's assume they are loadable or we mock require.
        // Since we are in Electron renderer, require works.

        // We need to intercept require calls for internal modules if they fail.
        // But let's try loading Scrutinizer first.

        // Mock Time
        let virtualTime = 10000;

        // Override both window and global performance if possible
        const originalNow = performance.now.bind(performance);

        // Define the mock
        const mockNow = () => virtualTime;

        // Attempt to override
        try {
            window.performance.now = mockNow;
        } catch (e) { }
        try {
            performance.now = mockNow;
        } catch (e) { }
        try {
            global.performance.now = mockNow;
        } catch (e) { }

        console.log('[TEST] Mocked time check:', performance.now());

        // --- TEST RUNNER ---

        const logDiv = document.getElementById('log');
        let hasFailed = false;
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = msg;
            if (type === 'pass') div.className = 'pass';
            if (type === 'fail') {
                div.className = 'fail';
                hasFailed = true;
            }
            logDiv.appendChild(div);
            ipcRenderer.send('log', `[TEST] ${msg}`);
        }

        async function runTests() {
            try {
                // Load Scrutinizer
                require('../renderer/scrutinizer.js');

                // 1. Setup
                const config = {
                    fovealRadius: 100,
                    intensity: 0.8,
                    maskSmoothness: 1.0, // Instant
                    visualMemoryLimit: 2,
                    debugBoundary: 0,
                    mongrelMode: 0,
                    aestheticMode: 0
                };

                const scrutinizer = new window.Scrutinizer(config);
                scrutinizer.enable();
                scrutinizer.lastRenderTime = virtualTime; // Sync initial time

                // Helper to tick
                const tick = (ms) => {
                    virtualTime += ms;
                };

                // --- TEST CASE 1: Fixation Logic ---
                log('Test 1: Fixation Logic (Dwell 50ms)', 'info');

                // Move to 100,100
                scrutinizer.mouseX = 100; scrutinizer.mouseY = 100;
                scrutinizer.targetMouseX = 100; scrutinizer.targetMouseY = 100;
                scrutinizer.lastMouseX = 100; scrutinizer.lastMouseY = 100;
                scrutinizer.currentVelocity = 0;

                // Render frame 1
                scrutinizer.render();

                // Advance 20ms (Should NOT be in buffer yet, dwell is 50ms)
                tick(20);
                scrutinizer.render();

                if (scrutinizer.visualMemoryBuffer.length === 0) {
                    log('PASS: Buffer empty after 20ms', 'pass');
                } else {
                    log(`FAIL: Buffer has ${scrutinizer.visualMemoryBuffer.length} items after 20ms`, 'fail');
                }

                // Advance another 40ms (Total 60ms -> Should be in buffer)
                tick(40);
                scrutinizer.render();

                if (scrutinizer.visualMemoryBuffer.length === 1) {
                    log('PASS: Buffer has 1 item after 60ms', 'pass');
                } else {
                    log(`FAIL: Buffer has ${scrutinizer.visualMemoryBuffer.length} items after 60ms`, 'fail');
                    log(`Debug: Velocity=${scrutinizer.currentVelocity}, Fixating=${scrutinizer.isFixating}, Dwell=${virtualTime - scrutinizer.fixationStartTime}`);
                }

                // --- TEST CASE 2: FIFO Eviction ---
                log('Test 2: FIFO Eviction (Limit 2)', 'info');

                // Move to B (400, 400)
                // Simulate movement velocity to break fixation (Threshold is 20.0, so use 50.0)
                scrutinizer.currentVelocity = 50.0;
                tick(100);
                scrutinizer.render();

                scrutinizer.mouseX = 400; scrutinizer.mouseY = 400;
                scrutinizer.targetMouseX = 400; scrutinizer.targetMouseY = 400;
                scrutinizer.lastMouseX = 400; scrutinizer.lastMouseY = 400;
                scrutinizer.currentVelocity = 0;

                // Dwell at B
                tick(200); // > 50ms
                scrutinizer.render();

                if (scrutinizer.visualMemoryBuffer.length === 2) {
                    log('PASS: Buffer has 2 items (A, B)', 'pass');
                } else {
                    log(`FAIL: Buffer has ${scrutinizer.visualMemoryBuffer.length} items (Expected 2)`, 'fail');
                }

                // Move to C (500, 500) -> Should evict A
                scrutinizer.currentVelocity = 50.0;
                tick(100);
                scrutinizer.render();

                scrutinizer.mouseX = 500; scrutinizer.mouseY = 500;
                scrutinizer.targetMouseX = 500; scrutinizer.targetMouseY = 500;
                scrutinizer.lastMouseX = 500; scrutinizer.lastMouseY = 500;
                scrutinizer.currentVelocity = 0;

                // Dwell at C
                tick(200);
                scrutinizer.render();

                if (scrutinizer.visualMemoryBuffer.length === 2) {
                    const p1 = scrutinizer.visualMemoryBuffer[0]; // Should be B (400,400)
                    const p2 = scrutinizer.visualMemoryBuffer[1]; // Should be C (500,500)

                    const distB = Math.hypot(p1.x - 400, p1.y - 400);
                    const distC = Math.hypot(p2.x - 500, p2.y - 500);

                    if (distB < 1 && distC < 1) {
                        log('PASS: FIFO worked. Buffer contains B and C.', 'pass');
                    } else {
                        log(`FAIL: Buffer content mismatch. [0]=(${p1.x},${p1.y}), [1]=(${p2.x},${p2.y})`, 'fail');
                    }
                } else {
                    log(`FAIL: Buffer length is ${scrutinizer.visualMemoryBuffer.length} (Expected 2)`, 'fail');
                }

                // --- TEST CASE 3: Infinite Mode ---
                log('Test 3: Infinite Mode (-1)', 'info');

                scrutinizer.setVisualMemoryLimit(-1);
                // Buffer should be cleared on mode change
                if (scrutinizer.visualMemoryBuffer.length === 0) {
                    log('PASS: Buffer cleared on mode change', 'pass');
                } else {
                    log('FAIL: Buffer NOT cleared on mode change', 'fail');
                }

                // Add 3 points
                const points = [[100, 100], [200, 200], [300, 300]];

                for (const p of points) {
                    // Move
                    scrutinizer.currentVelocity = 50.0;
                    tick(100);
                    scrutinizer.render();

                    scrutinizer.mouseX = p[0]; scrutinizer.mouseY = p[1];
                    scrutinizer.targetMouseX = p[0]; scrutinizer.targetMouseY = p[1];
                    scrutinizer.lastMouseX = p[0]; scrutinizer.lastMouseY = p[1];
                    scrutinizer.currentVelocity = 0;

                    // Dwell
                    tick(2500);
                    scrutinizer.render();
                }

                if (scrutinizer.visualMemoryBuffer.length === 3) {
                    log('PASS: Infinite mode accumulated 3 points', 'pass');
                } else {
                    log(`FAIL: Infinite mode has ${scrutinizer.visualMemoryBuffer.length} points (Expected 3)`, 'fail');
                }

                // Restore
                // window.performance.now = originalNow; // Can't easily restore if we overwrote property

                if (hasFailed) {
                    ipcRenderer.send('test-result', { success: false, message: 'Some tests failed. Check logs.' });
                } else {
                    ipcRenderer.send('test-result', { success: true, message: 'All tests passed' });
                }

            } catch (err) {
                log(`ERROR: ${err.message}`, 'fail');
                console.error(err);
                ipcRenderer.send('test-result', { success: false, message: err.message });
            }
        }

        // Run
        runTests();

    </script>
</body>

</html>
