[project]
name = "scrutinizer-validation"
version = "0.1.0"
description = "Validation scripts for Scrutinizer feature congestion vs Rosenholtz reference"
requires-python = ">=3.10,<3.13"
dependencies = [
    "visual-clutter",
    "polars",
    "numpy>=1.26",
    "Pillow",
]

[tool.uv]
# visual-clutter (v1.0.7) pins ancient versions of numpy, scipy, scikit-image,
# Pillow, and matplotlib that won't build on Python 3.12 (no distutils).
# Override all transitive pins to force modern wheel-available versions.
override-dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "opencv-python>=4.9",
]
